name: CI

# release.yml also calls this workflow, so a release only happens after all of it passes.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]
  workflow_call:

# A new push makes a PR's running CI moot; a push to a branch always finishes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DESTINATION: platform=iOS Simulator,name=iPhone 17

jobs:
  format:
    name: swift-format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Check formatting, crash paths and public docs
        run: xcrun swift-format lint --strict --recursive Sources Tests Example

  swiftlint:
    name: SwiftLint
    runs-on: ubuntu-latest
    # A contributor tool, so it stays out of Package.swift and Cerebro.podspec.
    # The container pins the version and installs nothing.
    container: ghcr.io/realm/swiftlint:0.62.2
    steps:
      - uses: actions/checkout@v7
      - name: Check code quality
        run: swiftlint lint --strict --reporter github-actions-logging

  package:
    name: SPM build and tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # The workspace is explicit because xcodebuild would otherwise pick Cerebro.xcodeproj.
      - name: Test on an iOS simulator
        run: |
          xcodebuild test \
            -workspace .swiftpm/xcode/package.xcworkspace \
            -scheme Cerebro-Package \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            -quiet

  example:
    name: Example app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build for an iOS simulator
        run: |
          xcodebuild build \
            -project Example/CerebroExample.xcodeproj \
            -scheme CerebroExample \
            -destination "$DESTINATION" \
            -skipPackagePluginValidation \
            -quiet

  pod:
    name: Pod build and lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Lint every subspec
        run: pod lib lint Cerebro.podspec

  xcframework:
    name: XCFrameworks
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build and compile a client against them
        run: Scripts/build-xcframework.sh

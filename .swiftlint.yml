# Code quality checks for contributors. This file does nothing for apps that use Cerebro.
# swift-format owns formatting, crash paths and public docs, so those rules stay off here.

included:
  - Sources
  - Tests
  - Example

excluded:
  # Output of protoc-gen-swift, which writes its own blanket disable.
  - Example/CerebroExample/quote.pb.swift

disabled_rules:
  - force_cast
  - force_try
  - line_length
  - trailing_comma

opt_in_rules:
  # Host app safety
  - async_without_await
  - fatal_error_message
  - overridden_super_call
  - unhandled_throwing_task
  - unowned_variable_capture
  - weak_delegate

  # Simpler, faster standard library use
  - array_init
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - legacy_random
  - reduce_into
  - sorted_first_last
  - toggle_bool

  # Clearer code
  - discouraged_optional_boolean
  - prefer_self_in_static_references
  - redundant_nil_coalescing
